name: Build APK or AAB
on:
  repository_dispatch:
    types: [build-apk]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Generate Android project
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          WEBSITE_URL: ${{ github.event.client_payload.website_url }}
          VERSION: ${{ github.event.client_payload.meta.version }}
          VERSION_CODE: ${{ github.event.client_payload.meta.version_code }}
          PRIMARY_COLOR: ${{ github.event.client_payload.meta.primary_color }}
          SECONDARY_COLOR: ${{ github.event.client_payload.meta.secondary_color }}
          UPDATE_URL: ${{ github.event.client_payload.meta.update_url }}
          OPT_SPLASH: ${{ github.event.client_payload.options.splash }}
          BACKGROUND_COLOR: ${{ github.event.client_payload.meta.background_color }}
          ORIENTATION: ${{ github.event.client_payload.meta.orientation }}
          ICON_URL: ${{ github.event.client_payload.icon_url }}
          OPT_BACK: ${{ github.event.client_payload.options.back_button }}
          OPT_EXTERNAL: ${{ github.event.client_payload.options.external_links }}
          OPT_REFRESH: ${{ github.event.client_payload.options.pull_to_refresh }}
          OPT_FULLSCREEN: ${{ github.event.client_payload.options.fullscreen }}
        run: bash build-android.sh
      - name: Restore or create signing key
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
        run: python3 signing.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble
        env:
          FORMAT: ${{ github.event.client_payload.meta.output_format }}
        run: |
          if [ "$FORMAT" = "aab" ]; then gradle bundleRelease --no-daemon; else gradle assembleRelease --no-daemon; fi
      - name: Name Joker files
        env:
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          VERSION_CODE: ${{ github.event.client_payload.meta.version_code }}
        run: |
          mkdir -p joker-output
          FILE=$(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) | head -n1)
          cp "$FILE" "joker-output/Joker-${BUILD_ID:0:8}-v${VERSION_CODE}.${FILE##*.}"
      - uses: actions/upload-artifact@v4
        with:
          name: Joker-${{ github.event.client_payload.build_id }}
          path: joker-output/*
      - name: Return Android file
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
        run: |
          APK=$(find joker-output -type f | head -n1)
          curl --fail-with-body --retry 2 -X POST "$CALLBACK_URL" -H "x-build-secret: $SECRET" -F "build_id=$BUILD_ID" -F status=success -F "file=@$APK;type=application/vnd.android.package-archive"
      - name: Report failure
        if: failure()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
        run: |
          curl --fail-with-body -X POST "$CALLBACK_URL" -H "x-build-secret: $SECRET" -F "build_id=$BUILD_ID" -F status=failed -F 'error_message=La compilation Android a échoué.'
